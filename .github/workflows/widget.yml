name: Widget checks

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/widget/**'
      - '.github/workflows/widget.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/widget/**'
      - '.github/workflows/widget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/widget/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/widget

      - name: Run frontend tests
        run: npm test -- --maxWorkers=2 --no-file-parallelism
        working-directory: apps/widget

      - name: Build frontend
        run: npm run build
        working-directory: apps/widget

  windows-installer:
    name: Build Windows x64 installer
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/widget/src-tauri -> target

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install dependencies
        run: npm ci
        working-directory: apps/widget

      - name: Run frontend tests
        run: npm test -- --maxWorkers=2 --no-file-parallelism
        working-directory: apps/widget

      - name: Build Windows installer
        run: npm run tauri build
        working-directory: apps/widget

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: chronix-widget-windows-x64
          path: apps/widget/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
