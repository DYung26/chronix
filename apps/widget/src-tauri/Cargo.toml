[package]
name = "chronix-widget"
version = "0.1.0"
description = "A minimal desktop visualization of concurrent Chronix tasks"
authors = ["DYung26"]
edition = "2024"

[lib]
name = "chronix_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
